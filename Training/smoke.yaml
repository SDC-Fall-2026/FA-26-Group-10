# Pipeline validation, NOT an Easy/Normal/Hard model.
behaviors:
  HotPotatoV1:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 1024
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 4096
    time_horizon: 128
    summary_freq: 1024
    checkpoint_interval: 4096
    keep_checkpoints: 2
engine_settings:
  time_scale: 20
  no_graphics: true
torch_settings:
  device: cpu
