behaviors:
  HotPotatoV1:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 250000
    time_horizon: 128
    summary_freq: 5000
    checkpoint_interval: 25000
    keep_checkpoints: 10
engine_settings:
  time_scale: 100
  no_graphics: true
torch_settings:
  device: cpu
